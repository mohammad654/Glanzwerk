# The Maven version `./mvnw` uses. This file was missing, so `./mvnw` failed with
# "cannot open .mvn/wrapper/maven-wrapper.properties" and every build had to go
# through a system-wide `mvn` instead — which is the thing a wrapper exists to avoid.
#
# No wrapperUrl and no jar: the bundled mvnw is the script-only wrapper, which reads
# just this one property and downloads the distribution on first use.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
