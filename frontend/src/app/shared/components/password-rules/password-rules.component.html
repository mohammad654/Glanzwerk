<!-- A list rather than a sentence, so each requirement can answer for itself. The
     icon is decorative: the state is also in the visually hidden word after the
     label, because colour and a tick cannot carry it on their own. -->
<ul class="password-rules">
  @for (rule of rules(); track rule.id) {
    <li class="password-rules__rule" [class.is-met]="rule.met">
      <i [appIcon]="rule.met ? 'bi-check-circle-fill' : 'bi-circle'" aria-hidden="true"></i>
      <span>{{ rule.label }}</span>
      @if (rule.met) {
        <span class="password-rules__state" i18n="@@password.rule.met">— met</span>
      } @else {
        <span class="password-rules__state" i18n="@@password.rule.unmet">— still needed</span>
      }
    </li>
  }
</ul>
