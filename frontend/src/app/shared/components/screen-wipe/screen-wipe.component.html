<!-- A status, not content: it sits over the page for about a second while the app
     boots, and a screen reader should say so rather than read the logo and move on. -->
<div class="wipe__foam" role="status" aria-live="polite">
  <div class="wipe__bubbles" aria-hidden="true">
    @for (bubble of bubbles; track bubble) {
      <span></span>
    }
  </div>

  <div class="wipe__brand">
    <img src="assets/images/glanzwork-logo-light.png" alt="Glanzwork Gebäudereinigung Dresden" width="242" height="134" />
    <p class="wipe__message">{{ message() }}</p>
  </div>

  <div class="wipe__squeegee" aria-hidden="true"></div>
</div>
