<section class="projects">
  <div class="container">
    <div class="section-title">
      <span i18n="@@projects.eyebrow">Projects</span>
      <h2 i18n="@@projects.heading">Recent Work</h2>
      <p i18n="@@projects.lead">
        A selection of current contracts and completed projects across commercial, hospitality and
        managed residential property.
      </p>
    </div>

    <swiper-container
      class="projects__slider"
      loop="true"
      space-between="30"
      slides-per-view="1"
      autoplay-delay="5000"
      breakpoints='{"576": {"slidesPerView": 2}, "992": {"slidesPerView": 3}}'
    >
      @for (project of projects; track project.slug) {
        <swiper-slide>
          <app-project-card [project]="project" />
        </swiper-slide>
      }
    </swiper-container>
  </div>
</section>
