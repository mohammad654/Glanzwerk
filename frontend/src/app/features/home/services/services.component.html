<section class="services">
  <div class="container">
    <div class="section-title">
      <span i18n="@@services.eyebrow">Services</span>
      <h2 i18n="@@services.heading">We Do More Than Clean. We Get Things Done.</h2>
      <p i18n="@@services.lead">
        Every service from one team. Book a standing contract or a single last-minute job.
      </p>
    </div>

    <div class="row">
      @for (service of services; track service.key) {
        <div class="col-lg-4 col-sm-6">
          <div class="service">
            <a
              class="service__media"
              [routerLink]="path(service)"
              tabindex="-1"
              aria-hidden="true"
            >
              <img [src]="service.image" [alt]="service.title" loading="lazy" [width]="imageSize.width" [height]="imageSize.height" />
            </a>

            <div class="service__content">
              <h3>
                <a [routerLink]="path(service)">{{ service.title }}</a>
              </h3>
              <p>{{ service.summary }}</p>

              <a class="read-more" [routerLink]="path(service)">
                <ng-container i18n="@@cta.readMore">Read More</ng-container>
                <i appIcon="bi-plus-lg" aria-hidden="true"></i>
              </a>

              <span class="service__badge" aria-hidden="true">
                <i [appIcon]="service.icon"></i>
              </span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
