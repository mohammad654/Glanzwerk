<section class="blog">
  <div class="container">
    @if (!hideTitle()) {
      <div class="section-title">
        <span i18n="@@blog.eyebrow">News</span>
        <h2 i18n="@@blog.heading">Insight & Advice</h2>
        <p i18n="@@blog.lead">
          Practical guidance on specifying, buying and managing building cleaning, written by the
          people who carry it out.
        </p>
      </div>
    }

    <div class="row">
      @for (post of posts; track post.slug) {
        <div class="col-lg-4 col-md-6">
          <article class="post">
            <a class="post__media" [routerLink]="path(post.slug)" tabindex="-1" aria-hidden="true">
              <img [src]="post.image" [alt]="post.title" loading="lazy" />
            </a>

            <div class="post__content">
              <ul>
                <li>{{ post.author }}</li>
                <li>{{ post.date }}</li>
              </ul>

              <h3>
                <a [routerLink]="path(post.slug)">{{ post.title }}</a>
              </h3>
              <p>{{ post.excerpt }}</p>

              <a class="read-more" [routerLink]="path(post.slug)">
                <ng-container i18n="@@cta.readMore">Read More</ng-container>
                <i appIcon="bi-plus-lg" aria-hidden="true"></i>
              </a>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>
