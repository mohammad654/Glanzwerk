<section class="feature-strip">
  <div class="container">
    <div class="row">
      <div class="col-lg-9">
        <div class="feature-strip__wrap">
          <div class="row g-0">
            @for (feature of features; track feature.title) {
              <div class="col-lg-4 col-sm-6">
                <div class="feature">
                  <i [class]="'bi ' + feature.icon" aria-hidden="true"></i>
                  <h3>{{ feature.title }}</h3>
                  <p>{{ feature.text }}</p>
                </div>
              </div>
            }
          </div>
        </div>
      </div>

      <div class="col-lg-3">
        <div class="hot-line">
          <span i18n="@@featureStrip.hotline">Hot Line</span>
          <h3>
            <i class="bi bi-telephone-outbound" aria-hidden="true"></i>
            <ng-container i18n="@@featureStrip.contactToday">Contact Us Today!</ng-container>
          </h3>
          <a [href]="'tel:' + company.phone">{{ company.phone }}</a>
        </div>
      </div>
    </div>
  </div>
</section>
