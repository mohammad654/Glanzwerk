<section class="testimonials">
  <div class="container">
    <div class="testimonials__head">
      <div class="section-title testimonials__title">
        <span i18n="@@testimonials.eyebrow">Testimonials</span>
        <h2 i18n="@@testimonials.heading">What Our Clients Say</h2>
      </div>

      <div class="testimonials__nav">
        <button
          type="button"
          (click)="slide('slidePrev')"
          i18n-aria-label="@@testimonials.prev"
          aria-label="Previous testimonial"
        >
          <i appIcon="bi-arrow-left" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          (click)="slide('slideNext')"
          i18n-aria-label="@@testimonials.next"
          aria-label="Next testimonial"
        >
          <i appIcon="bi-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <swiper-container
      #slider
      class="testimonials__slider"
      rewind="true"
      autoplay-delay="1200"
      speed="450"
      (swiperslidechange)="settle()"
      space-between="24"
      slides-per-view="1.08"
      breakpoints='{"768":{"slidesPerView":2},"1200":{"slidesPerView":2.4}}'
    >
      @for (testimonial of testimonials; track testimonial.name) {
        <swiper-slide class="testimonials__slide">
          <figure class="testimonials__card">
            <div class="testimonials__person">
              <span class="testimonials__avatar" aria-hidden="true">
                <i appIcon="bi-quote"></i>
              </span>
              <figcaption>
                <span class="testimonials__name">{{ testimonial.name }}</span>
                <span class="testimonials__role">{{ testimonial.role }}</span>
              </figcaption>
              <span
                class="testimonials__stars"
                i18n-aria-label="@@testimonials.rating"
                aria-label="Rated five out of five"
              >
                @for (star of stars; track $index) {
                  <i appIcon="bi-star-fill" aria-hidden="true"></i>
                }
              </span>
            </div>

            <blockquote>
              <p>{{ testimonial.quote }}</p>
            </blockquote>
          </figure>
        </swiper-slide>
      }
    </swiper-container>
  </div>
</section>
